name: Build GITLS

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in $ANDROID_SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager exits normally after consuming the answers; `yes` can
          # receive SIGPIPE when that happens. Do not let that expected
          # SIGPIPE from the producer fail the workflow.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$status" -ne 0 ]; then
            echo "sdkmanager --licenses failed with exit code $status"
            exit "$status"
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Check project structure
        run: bash scripts/ci-check.sh

      - name: Build debug APK + unit tests
        run: gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest

      - name: Build release APK and Play Store AAB
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GITLS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: GITLS-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: GITLS-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
